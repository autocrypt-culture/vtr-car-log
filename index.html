<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>VTR 공용차량 운행일지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--blue:#0098FF;--navy:#163E64;--ink:#14202c;--sub:#6b7885;--line:#e3eaf1;--bg:#f2f7fc;--soft:#E5F3FF;--red:#DB2F2F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:110px}
.hero{background:linear-gradient(160deg,#0098FF 0%,#0a6fd1 60%,#163E64 100%);color:#fff;padding:34px 22px 74px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero small{opacity:.85;font-weight:600;letter-spacing:.04em;font-size:12px}
.hero h1{margin:6px 0 4px;font-size:25px;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;opacity:.92;font-size:14px;line-height:1.55}.hero p.big{font-size:16px;font-weight:700;margin-bottom:4px;opacity:1}
.car-tag{display:inline-flex;gap:6px;align-items:center;margin-top:14px;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600}
.wrap{max-width:520px;margin:-48px auto 0;padding:0 16px;position:relative}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#fff;border-radius:18px;padding:6px;box-shadow:0 8px 24px rgba(22,62,100,.12)}
.seg button{border:0;background:transparent;border-radius:13px;padding:16px 8px;font:inherit;font-size:16px;font-weight:700;color:var(--sub);cursor:pointer;transition:.2s}
.seg button span{display:block;font-size:12px;font-weight:500;margin-top:2px;opacity:.8}
.seg button.on{background:var(--blue);color:#fff;box-shadow:0 6px 14px rgba(0,152,255,.35)}
.card{background:#fff;border-radius:20px;padding:20px 18px;margin-top:14px;box-shadow:0 2px 10px rgba(22,62,100,.06)}
.card h2{margin:0 0 14px;font-size:15px;font-weight:800;display:flex;gap:8px;align-items:center}
.card h2 i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--blue);display:inline-grid;place-items:center;font-size:12px}
label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:14px 0 6px}
label:first-of-type{margin-top:0}
input[type=text],input[type=number],input[type=datetime-local],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:14px;font:inherit;font-size:17px;background:#fafcfe;color:var(--ink);outline:none;appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(0,152,255,.12)}
textarea{min-height:76px;resize:none;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.unit{position:relative}.unit b{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--sub);font-weight:600;font-size:15px}
.unit input{padding-right:48px}
.hint{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.45}
.chips{display:grid;gap:8px}.chips.two{grid-template-columns:1fr 1fr}.chips.two button{justify-content:center;text-align:center;font-size:16px;padding:15px 8px}.chips.two button.on:after{content:none}
.chips button{border:1.5px solid var(--line);background:#fafcfe;border-radius:14px;padding:15px 14px;font:inherit;font-size:15.5px;font-weight:600;text-align:left;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.chips button small{font-weight:500;color:var(--sub);font-size:12.5px;display:block;margin-top:2px}
.chips button.on{border-color:var(--blue);background:var(--soft);color:#005a99}
.chips button.on:after{content:"✓";color:var(--blue);font-weight:800}
.when{display:flex;justify-content:space-between;align-items:center;background:#fafcfe;border:1.5px solid var(--line);border-radius:13px;padding:12px 14px}
.when b{font-size:15px}.when a{color:var(--blue);font-weight:700;font-size:14px;cursor:pointer}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{position:relative;border:1.5px dashed #b9d7ee;border-radius:16px;background:#f7fbff;aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;cursor:pointer}
.ph.wide{grid-column:1/3;aspect-ratio:auto;height:118px;flex-direction:row;gap:14px}
.ph svg{width:70px;height:70px}
.ph span{font-size:13.5px;font-weight:700;color:var(--navy)}
.ph em{font-style:normal;font-size:11.5px;color:var(--sub);font-weight:500;display:block;text-align:center}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .ok{position:absolute;top:8px;right:8px;background:var(--blue);color:#fff;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;z-index:2}
.ph input{display:none}
.ph.has{border-style:solid;border-color:var(--blue)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(242,247,252,.95) 30%)}
.bar button{display:block;max-width:520px;margin:0 auto;width:100%;border:0;border-radius:16px;background:var(--blue);color:#fff;font:inherit;font-size:17px;font-weight:800;padding:17px;box-shadow:0 10px 22px rgba(0,152,255,.4);cursor:pointer}
.bar button:disabled{background:#9fb8cc;box-shadow:none}
.err{color:var(--red);font-size:13px;font-weight:600;margin-top:10px;display:none;text-align:center}
.done{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:9}
.done .c{width:84px;height:84px;border-radius:50%;background:var(--blue);color:#fff;font-size:44px;display:grid;place-items:center;margin-bottom:20px;box-shadow:0 12px 30px rgba(0,152,255,.4)}
.done h2{margin:0 0 8px;font-size:24px}.done p{color:var(--sub);margin:0 0 28px;line-height:1.5}
.done button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 22px;font:inherit;font-weight:700;color:var(--navy)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="hero">
  <small>AUTOCRYPT · VTR연구소</small>
  <h1>공용차량 운행일지</h1>
  <p class="big" style="margin-bottom:14px">무엇보다 소중한 건 여러분의 안전입니다</p><p>오늘도 안전운전 부탁드려요 :)<br>사진은 운행 종료 후에만 찰칵! 📸</p>
  <div class="car-tag" id="carTag">테슬라 Y · 15허 0731</div>
</div>

<div class="wrap">
  <div class="seg" id="seg">
    <button data-t="start" class="on">운행 시작<span>차를 타고 출발해요</span></button>
    <button data-t="end">운행 종료<span>주차하고 마쳤어요</span></button>
  </div>

  <div class="card">
    <h2><i>1</i>운전자 정보</h2>
    <div class="row">
      <div><label for="dept">부서</label><input id="dept" type="text" placeholder="인사총무그룹" autocomplete="off"></div>
      <div><label for="name">이름</label><input id="name" type="text" placeholder="홍길동" autocomplete="off"></div>
    </div>
    <label>동승자</label>
    <div class="chips two" id="pax">
      <button type="button" data-v="none">없어요</button>
      <button type="button" data-v="yes">있어요</button>
    </div>
    <input id="paxName" type="text" class="hide" style="margin-top:8px" placeholder="동승자 부서·이름 (예: 인사총무그룹 김철수)">
    <label>운행 시각</label>
    <div class="when"><b id="whenTxt"></b><a id="whenBtn">바꾸기</a></div>
    <input id="when" type="datetime-local" class="hide" style="margin-top:8px">
    <div class="hint">나중에 기록하시는 거면 실제 시각으로 바꿔주세요.</div>
  </div>

  <div class="card">
    <h2><i>2</i>차량 상태</h2>
    <label for="km">계기판 주행거리</label>
    <div class="unit"><input id="km" type="number" inputmode="numeric" placeholder="예: 77845"><b>km</b></div>
    <label for="bat">화면에 보이는 충전량</label>
    <div class="unit"><input id="bat" type="number" inputmode="numeric" min="0" max="100" placeholder="예: 70"><b>%</b></div>

    <label id="chgQ"></label>
    <div class="chips two" id="chg"></div>
    <div class="hint" id="chgH"></div>
  </div>

  <div class="card hide" id="photoCard">
    <h2><i>3</i>사진 5장</h2>
    <div class="photos">
      <label class="ph wide" data-k="dash">
        <input type="file" accept="image/*">
        <svg viewBox="0 0 80 80"><rect x="6" y="18" width="68" height="40" rx="10" fill="#E5F3FF" stroke="#0098FF" stroke-width="3"/><text x="40" y="45" text-anchor="middle" font-size="16" font-weight="800" fill="#163E64">km</text><circle cx="40" cy="66" r="3" fill="#0098FF"/></svg>
        <div><span>계기판 화면</span><em>주행거리·충전량이 보이게</em></div>
      </label>
      <label class="ph" data-k="fl"><input type="file" accept="image/*"><svg viewBox="0 0 80 80"><use href="#car"/><circle cx="22" cy="12" r="9" fill="#0098FF"/><text x="22" y="16" text-anchor="middle" font-size="11" fill="#fff" font-weight="800">1</text></svg><span>앞 왼쪽 코너</span><em>앞면 + 왼쪽 옆면</em></label>
      <label class="ph" data-k="fr"><input type="file" accept="image/*"><svg viewBox="0 0 80 80"><use href="#car"/><circle cx="58" cy="12" r="9" fill="#0098FF"/><text x="58" y="16" text-anchor="middle" font-size="11" fill="#fff" font-weight="800">2</text></svg><span>앞 오른쪽 코너</span><em>앞면 + 오른쪽 옆면</em></label>
      <label class="ph" data-k="rl"><input type="file" accept="image/*"><svg viewBox="0 0 80 80"><use href="#car"/><circle cx="22" cy="68" r="9" fill="#0098FF"/><text x="22" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="800">3</text></svg><span>뒤 왼쪽 코너</span><em>뒷면 + 왼쪽 옆면</em></label>
      <label class="ph" data-k="rr"><input type="file" accept="image/*"><svg viewBox="0 0 80 80"><use href="#car"/><circle cx="58" cy="68" r="9" fill="#0098FF"/><text x="58" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="800">4</text></svg><span>뒤 오른쪽 코너</span><em>뒷면 + 오른쪽 옆면</em></label>
    </div>
    <div class="hint">차 모서리에서 대각선으로 서서, 앞(뒤)면과 옆면이 한 장에 같이 나오게 찍어주세요. 4장이면 차 전체가 다 보여요.</div>
  </div>

  <div class="card">
    <h2><i id="noteNo">3</i>특이사항 <span style="font-weight:500;color:var(--sub);font-size:13px">(선택)</span></h2>
    <textarea id="note" placeholder="행선지, 흠집, 불편했던 점 등 있으면 적어주세요"></textarea>
  </div>
  <div class="err" id="err"></div>
</div>

<div class="bar"><button id="go">시작 기록하기</button></div>

<div class="done" id="done">
  <div class="c">✓</div>
  <h2 id="doneT">기록 완료!</h2>
  <p id="doneP">고마워요. 안전 운행하세요</p>
  <button onclick="location.reload()">한 번 더 작성</button>
</div>

<svg width="0" height="0" style="position:absolute"><defs>
  <g id="car">
    <rect x="22" y="12" width="36" height="56" rx="14" fill="#E5F3FF" stroke="#163E64" stroke-width="2.5"/>
    <path d="M28 28 Q40 22 52 28 L50 36 H30Z" fill="#fff" stroke="#163E64" stroke-width="2"/>
    <path d="M30 52 H50 L52 58 Q40 62 28 58Z" fill="#fff" stroke="#163E64" stroke-width="2"/>
    <rect x="17" y="22" width="5" height="12" rx="2" fill="#163E64"/><rect x="58" y="22" width="5" height="12" rx="2" fill="#163E64"/>
    <rect x="17" y="46" width="5" height="12" rx="2" fill="#163E64"/><rect x="58" y="46" width="5" height="12" rx="2" fill="#163E64"/>
  </g></defs></svg>

<script>
// ===== 설정 (여기만 바꾸면 돼요) =====
const CONFIG = {
  ENDPOINT: "https://defaultb7f3bb90fd9f4bfab8844a11e7c213.1f.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/12/workflows/61d4d61d12aa4c98aad64182977bd3e3/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=JXY5nSVWfiTKeAzGkd8wfQszSLu_tbcDDzNs8-5biEU",          // Power Automate 웹후크 URL
  SECRET:   "",          // 흐름에서 확인하는 비밀 코드 (QR 주소의 ?k= 값으로도 전달 가능)
  CAR:      "테슬라 Y (15허 0731)"
};
const CARS = { tesla:{name:"테슬라 Y (15허 0731)",tag:"테슬라 Y · 15허 0731"}, bmw:{name:"BMW iX (14머7936)",tag:"BMW iX · 14머7936"} };
{ const c = CARS[(new URLSearchParams(location.search).get("car")||"tesla").toLowerCase()] || CARS.tesla;
  CONFIG.CAR = c.name; document.getElementById("carTag").textContent = c.tag; document.title = "[VTR연구소] 공용차량 운행일지 · " + c.name; }
// ====================================
const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
const secret = q.get("k") || CONFIG.SECRET;
let type = "start", charge = "", photos = {};

const CH = {
  start: { q:"출발 전에 충전했나요?", h:"출발 전에 충전하고 나가셨다면 ‘충전했어요’를 눌러주세요.", o:[["yes","충전했어요"],["no","안 했어요"]] },
  end:   { q:"충전기 꽂아뒀나요?", h:"다음 사람을 위한 거예요. 주차 후 충전기를 꽂아두셨다면 ‘충전했어요’를 눌러주세요.", o:[["yes","충전했어요"],["no","안 했어요"]] }
};
let pax="";
function pad(n){return String(n).padStart(2,"0")}
function nowLocal(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function fmt(v){const d=new Date(v);return `${d.getMonth()+1}월 ${d.getDate()}일 ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function setWhen(v){$("#when").value=v;$("#whenTxt").textContent=(v===nowLocal()?"지금 · ":"")+fmt(v)}
setWhen(nowLocal());
$("#whenBtn").onclick=()=>{$("#when").classList.toggle("hide")};
$("#when").onchange=e=>setWhen(e.target.value);

function render(){
  const isEnd=type==="end", c=CH[type];
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.t===type));
  $("#chgQ").textContent=c.q; $("#chgH").textContent=c.h; charge="";
  $("#chg").innerHTML=c.o.map(o=>`<button type="button" data-v="${o[0]}">${o[1]}</button>`).join("");
  $("#photoCard").classList.toggle("hide",!isEnd);
  $("#noteNo").textContent=isEnd?"4":"3";
  $("#go").textContent=isEnd?"종료 기록하기":"시작 기록하기";
  $("#err").style.display="none";
}
$("#seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;type=b.dataset.t;render()};
$("#chg").onclick=e=>{const b=e.target.closest("button");if(!b)return;charge=b.dataset.v;document.querySelectorAll("#chg button").forEach(x=>x.classList.toggle("on",x===b))};
render();
$("#pax").onclick=e=>{const b=e.target.closest("button");if(!b)return;pax=b.dataset.v;document.querySelectorAll("#pax button").forEach(x=>x.classList.toggle("on",x===b));$("#paxName").classList.toggle("hide",pax!=="yes")};

// 이름·부서 기억
try{$("#dept").value=localStorage.getItem("vl_dept")||"";$("#name").value=localStorage.getItem("vl_name")||""}catch(e){}

// 사진: 줄여서 저장
function shrink(file,max=1100){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};im.src=r.result};r.readAsDataURL(file)})}
document.querySelectorAll(".ph").forEach(el=>{
  el.querySelector("input").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    const d=await shrink(f);photos[el.dataset.k]=d;
    el.classList.add("has");el.querySelectorAll("img,.ok").forEach(x=>x.remove());
    el.insertAdjacentHTML("beforeend",`<img src="${d}"><div class="ok">✓</div>`);
  }
});

function fail(m){const e=$("#err");e.textContent=m;e.style.display="block";e.scrollIntoView({block:"center",behavior:"smooth"})}

$("#go").onclick=async()=>{
  const v={dept:$("#dept").value.trim(),name:$("#name").value.trim(),km:$("#km").value,bat:$("#bat").value};
  if(!v.dept||!v.name) return fail("부서와 이름을 입력해주세요.");
  if(!pax) return fail("동승자 여부를 선택해주세요.");
  if(pax==="yes"&&!$("#paxName").value.trim()) return fail("동승자 이름을 입력해주세요.");
  if(!v.km) return fail("계기판 주행거리를 입력해주세요.");
  if(v.bat===""||v.bat<0||v.bat>100) return fail("충전량(0~100%)을 입력해주세요.");
  if(!charge) return fail("충전 여부를 선택해주세요.");
  if(type==="end"){
    const miss=["dash","fl","fr","rl","rr"].filter(k=>!photos[k]);
    if(miss.length) return fail(`사진이 ${miss.length}장 더 필요해요.`);
  }
  const btn=$("#go");btn.disabled=true;btn.textContent="보내는 중…";
  const body={k:secret,car:CONFIG.CAR,type:type==="start"?"운행 시작":"운행 종료",dept:v.dept,name:v.name,passenger:pax==="yes"?$("#paxName").value.trim():"없음",
    when:$("#when").value.replace("T"," "),submitted:nowLocal().replace("T"," "),km:Number(v.km),battery:Number(v.bat),
    charge:(type==="start"?{yes:"출발 전 충전함",no:"출발 전 충전 안 함"}:{yes:"충전함(충전기 꽂아둠)",no:"충전 안 함"})[charge],
    note:$("#note").value.trim(),photos:type==="end"?photos:{}};
  try{
    localStorage.setItem("vl_dept",v.dept);localStorage.setItem("vl_name",v.name);
    if(!CONFIG.ENDPOINT) throw new Error("ENDPOINT 미설정");
    await fetch(CONFIG.ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body)});
    $("#doneT").textContent=type==="start"?"출발 기록 완료!":"종료 기록 완료!";
    $("#doneP").textContent=type==="start"?"안전 운행하세요":"수고하셨어요. 다음 사람을 위해 충전기 꽂아주세요";
    $("#done").style.display="flex";
  }catch(e){
    btn.disabled=false;btn.textContent=type==="start"?"시작 기록하기":"종료 기록하기";
    fail("전송에 실패했어요. 잠시 후 다시 시도해주세요.");
  }
};
</script>
</body>
</html>
